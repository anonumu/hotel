# ===================================================================
# Профиль для промышленного развертывания с СУБД PostgreSQL
# Активация: --spring.profiles.active=postgres
# ===================================================================
server.port=8080

# Параметры подключения к PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Настройки Hibernate для PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Автоматическая инициализация справочников и тестового фонда
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Форматирование JSON
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=GMT+3

